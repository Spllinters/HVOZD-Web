name: Publish HVOZD Web to gh-pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'HVOZD-Mobile-Web-Test.zip'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout public deployment repository
        uses: actions/checkout@v4

      - name: Unpack previously compiled HVOZD Web build
        shell: bash
        run: |
          set -euo pipefail
          test -s HVOZD-Mobile-Web-Test.zip
          mkdir -p "$RUNNER_TEMP/hvozd-web"
          unzip -q HVOZD-Mobile-Web-Test.zip -d "$RUNNER_TEMP/hvozd-web"
          test -s "$RUNNER_TEMP/hvozd-web/index.html"
          test -s "$RUNNER_TEMP/hvozd-web/index.js"
          test -s "$RUNNER_TEMP/hvozd-web/index.wasm"
          test -s "$RUNNER_TEMP/hvozd-web/index.pck"

      - name: Publish compiled files to gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hvozd-web"
          touch .nojekyll
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -b gh-pages
          git add .
          git commit -qm 'Publish HVOZD Mobile Web build'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/gh-pages
