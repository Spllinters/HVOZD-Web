name: Publish HVOZD 0.7 isolated iPhone preview (one-time)
on:
  push:
    paths:
      - '.github/workflows/hvozd-07-preview-once.yml'

permissions:
  contents: write

jobs:
  deploy-preview-07:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout existing gh-pages (preserve 0.5 and 0.6)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: true
      - name: Download separately compiled and validated 0.7 Web ZIP
        shell: bash
        env:
          BUNDLE_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-5e68-8246-a2e6-9e9827abe831/raw?se=2026-10-20T19%3A51%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=f3aefda0-4e27-50b0-a6a4-2606ece89eed&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-20T08%3A21%3A31Z&ske=2026-10-21T08%3A21%3A31Z&sks=b&skv=2026-02-06&sig=lbW7xxEaQBJ0XpZcVl5dbA4BS7sU0FFJqAYgYC4W6W8%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$BUNDLE_URL" --output "$RUNNER_TEMP/web-07.zip"
          echo "350e181ebb9282206a1616a1cb5d5e29f5497ed5cf83229a81df81801d537d51  $RUNNER_TEMP/web-07.zip" | sha256sum --check
          unzip -tq "$RUNNER_TEMP/web-07.zip"
          mkdir -p "$RUNNER_TEMP/web-07"
          unzip -q "$RUNNER_TEMP/web-07.zip" -d "$RUNNER_TEMP/web-07"
          for f in index.html index.js index.pck index.wasm; do test -s "$RUNNER_TEMP/web-07/$f"; done
      - name: Write only preview/0.7 and verify existing sites unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s index.pck
          test -s preview/0.6/index.pck
          root_before="$(sha256sum index.pck | cut -d' ' -f1)"
          prev_before="$(sha256sum preview/0.6/index.pck | cut -d' ' -f1)"
          mkdir -p preview/0.7
          rsync -a --delete "$RUNNER_TEMP/web-07/" preview/0.7/
          test -s preview/0.7/index.html
          test -s preview/0.7/index.pck
          test "$(sha256sum index.pck | cut -d' ' -f1)" = "$root_before"
          test "$(sha256sum preview/0.6/index.pck | cut -d' ' -f1)" = "$prev_before"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/0.7/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "HVOZD 0.7 playable isolated iPhone preview; preserve 0.5 and 0.6"
          git push origin HEAD:gh-pages
